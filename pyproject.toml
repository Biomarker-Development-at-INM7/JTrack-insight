[project]
name = "trackautism-app"
version = "0.1.0"
description = "Local-first quality control and analysis for digital phenotyping data."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
authors = [
  { name = "Biomarker Development at INM-7" }
]
dependencies = [
  "pandas>=2.2",
  "plotly>=6.0",
  "pydantic>=2.8",
]

[project.optional-dependencies]
desktop = []
server = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
]
science = [
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
]
storage = [
  "pyarrow>=18.0",
  "duckdb>=1.1",
]
dev = [
  "pyinstaller>=6.10",
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
